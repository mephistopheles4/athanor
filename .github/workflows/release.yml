# Stages a release of @mephistopheles4/athanor on npm through the trusted
# publisher, with provenance, behind the owner's two approvals (spec on issue 6,
# ADR 0019). The owner starts it by hand on main. The check job builds, tests and
# packs once, with no identity token. The publish job waits for the owner's
# approval of the npm environment, then stages exactly that tarball. It never
# checks out the repo and runs no repo code. The trusted publisher allows
# staging only, so a version goes live only when the owner approves it on npm
# with two-factor authentication (docs/releasing.md).
# Locked down: no permissions by default, each action pinned to a full commit
# SHA with a release at least 7 days old, an exact Node, no Actions cache, no
# registry .npmrc, and the checkout's token not left in the clone.
name: release

on:
  workflow_dispatch:

permissions: {}

# A run never cancels the one in progress. GitHub keeps at most one run waiting
# per group, so a newer queued run replaces one still waiting to start.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse any ref but main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "The release runs only from main. This run is on $GITHUB_REF. Start it again on main."; exit 1; }
      # Stands in for everything only CI runs: the docker tier, the install
      # scripts and registry check, and the install, version and typed-import
      # half of CI's pack check.
      - name: Check that CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          url=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f branch=main -f status=success \
            --jq '.workflow_runs[0].html_url // ""')
          test -n "$url" || { echo "CI has not passed on this commit. Wait for the ci run on main to finish green, then start the release again."; exit 1; }
          echo "CI passed on $GITHUB_SHA: $url"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      # The same check runs in both jobs; publish has no checkout to share a
      # script from, so change the two together.
      - name: Check the npm version
        run: |
          set -e
          v=$(npm --version)
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) {
              console.error("npm " + process.argv[1] + " is older than 11.15.0, which staged publishing needs. Pin a newer Node 24 in release.yml.");
              process.exit(1);
            }
          ' "$v"
          echo "npm: $v" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the workflows' own rules
        run: node scripts/check-workflows.mjs
      - name: Install the compiler from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the registry signatures of the installed packages
        run: npm audit signatures
      - name: Strict type check
        run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - name: Strict type check of the tests
        run: node node_modules/typescript/bin/tsc -p test/tsconfig.json --noEmit
      - name: Source check
        run: node scripts/check-source.mjs
      - name: Fast tier
        run: node test/run.mjs fast
      - name: Check that this version is new on npm
        run: |
          node -e '
            const version = require("./package.json").version;
            fetch("https://registry.npmjs.org/@mephistopheles4%2fathanor").then(async (res) => {
              if (res.status === 404) {
                console.error("@mephistopheles4/athanor is not on npm yet. Make the first publish by hand (docs/releasing.md), then use this workflow.");
                process.exit(1);
              }
              if (res.status !== 200) {
                console.error("Could not read the package from npm (HTTP " + res.status + "). Start the release again later.");
                process.exit(1);
              }
              let doc;
              try {
                doc = await res.json();
              } catch (err) {
                console.error("Could not read the package from npm (" + err.message + "). Start the release again later.");
                process.exit(1);
              }
              if (doc.versions && Object.hasOwn(doc.versions, version)) {
                console.error("Version " + version + " is already on npm. Bump the version in package.json, merge, and start the release again.");
                process.exit(1);
              }
              console.log("Version " + version + " is new on npm.");
            }, (err) => {
              console.error("Could not read the package from npm (" + err.message + "). Start the release again later.");
              process.exit(1);
            });
          '
      # The repo's .npmrc turns prepack off (ADR 0018), so the build is explicit,
      # and nothing runs between it and the pack.
      - name: Build and pack once
        run: |
          set -e
          rm -rf dist
          node scripts/build.mjs
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
      - name: Check what the package holds
        run: |
          set -e
          tgz=$(ls "$RUNNER_TEMP"/release/mephistopheles4-athanor-*.tgz)
          node scripts/check-pack.mjs "$tgz"
          # The same integrity line runs in both jobs, and the owner compares the
          # two summaries; change the two together.
          integrity=$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); console.log("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tgz")
          {
            echo "tarball: $(basename "$tgz")"
            echo "integrity: $integrity"
            echo "commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      # The owner approves the npm deployment within the 3 days this lasts.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/release/mephistopheles4-athanor-*.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: publish
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # An expired artifact fails here, and nothing is staged.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      # The same check runs in both jobs; publish has no checkout to share a
      # script from, so change the two together.
      - name: Check the npm version
        run: |
          set -e
          v=$(npm --version)
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) {
              console.error("npm " + process.argv[1] + " is older than 11.15.0, which staged publishing needs. Pin a newer Node 24 in release.yml.");
              process.exit(1);
            }
          ' "$v"
          echo "npm: $v" >> "$GITHUB_STEP_SUMMARY"
      - name: Check that there is one tarball
        working-directory: ${{ runner.temp }}/release
        run: |
          set -e
          names=$(ls -A)
          test -n "$names" || { echo "The artifact holds no file. Start the release again."; exit 1; }
          test "$(printf '%s\n' "$names" | wc -l)" -eq 1 || { echo "The artifact holds more than one file: $names. Start the release again."; exit 1; }
          printf '%s\n' "$names" | grep -Eqx 'mephistopheles4-athanor-[0-9]+\.[0-9]+\.[0-9]+\.tgz' || { echo "The artifact's file is not a release tarball: $names. Start the release again."; exit 1; }
          # The same integrity line runs in both jobs, and the owner compares the
          # two summaries; change the two together.
          integrity=$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); console.log("sha512-" + crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$names")
          echo "integrity of the tarball to stage: $integrity" >> "$GITHUB_STEP_SUMMARY"
      # Runs outside any checkout, so no project .npmrc applies. --provenance
      # makes the stage fail rather than go out without provenance.
      - name: Stage the tarball
        working-directory: ${{ runner.temp }}/release
        run: |
          set -e
          tgz=$(ls mephistopheles4-athanor-*.tgz)
          npm stage publish "./$tgz" --provenance --access public --ignore-scripts --json > "$RUNNER_TEMP/stage.json"
          # npm 11.19.1 writes { "<package name>": { ..., "stageId": "..." } }; a
          # top-level stageId is read too, in case a later npm flattens it.
          stage_id=$(node -e 'const out = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const id = out.stageId ?? Object.values(out)[0]?.stageId; if (!id) process.exit(1); console.log(id)' "$RUNNER_TEMP/stage.json") || { echo "npm staged the tarball but printed no stage id. Do not re-run this job: follow \"If a run fails\" in docs/releasing.md."; exit 1; }
          {
            echo "staged: $tgz"
            echo "stage id: $stage_id"
            echo ""
            echo "Next, the owner's steps in docs/releasing.md: build and pack locally, log in, check that exactly one entry is staged and that its integrity matches the check job's, compare every file, then approve with npm stage approve $stage_id or reject."
          } >> "$GITHUB_STEP_SUMMARY"

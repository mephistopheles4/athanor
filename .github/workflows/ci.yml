# One job on Linux and Node 24 (spec S4, C27; spec on issue 8, S4): npm ci from
# the lockfile, a strict tsc check of src/ and of test/, a syntax check of
# every .mjs file, the source check, both test tiers (each builds dist/ first;
# the docker tier uses the runner's own Docker engine), and npm pack followed
# by a check of what the packed file holds, an install of it into a temporary
# prefix, and a type check of a file that imports it by its name and sees no
# test-only option. Locked down for a public repo: a read-only token, no
# secrets, each action pinned to a full commit SHA, and the checkout's
# token not left in the clone.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the compiler from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict type check
        run: node node_modules/typescript/bin/tsc -p tsconfig.json --noEmit
      - name: Strict type check of the tests
        run: node node_modules/typescript/bin/tsc -p test/tsconfig.json --noEmit
      - name: Syntax check of every .mjs file
        run: |
          set -e
          git ls-files '*.mjs' | while read -r f; do node --check "$f"; done
      - name: Source check
        run: node scripts/check-source.mjs
      - name: Fast tier
        run: node test/run.mjs fast
      - name: Docker tier
        run: node test/run.mjs docker
      - name: Pack and install
        run: |
          set -e
          # The tiers left a dist/ behind; clear it so only prepack can build it.
          rm -rf dist
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/mephistopheles4-athanor-*.tgz)
          # Only bin/, dist/ (compiled JavaScript and its declarations), the
          # README, the LICENSE and package.json ship.
          packed=$(tar -tzf "$tgz")
          unexpected=$(printf '%s\n' "$packed" | grep -Ev '^package/(bin/[^/]+\.mjs|dist/[^/]+\.(m?js|d\.m?ts)|README\.md|LICENSE|package\.json)$' || true)
          test -z "$unexpected" || { echo "unexpected files in the package: $unexpected"; exit 1; }
          printf '%s\n' "$packed" | grep -qx 'package/dist/index.d.ts'
          prefix="$RUNNER_TEMP/athanor-prefix"
          npm install --global --prefix "$prefix" "$tgz"
          expected=$(node -p "require('./package.json').version")
          actual=$("$prefix/bin/athanor" --version)
          test "$actual" = "$expected"
      - name: Typed import by package name
        run: |
          set -e
          tgz=$(ls "$RUNNER_TEMP"/mephistopheles4-athanor-*.tgz)
          project="$RUNNER_TEMP/athanor-typed"
          mkdir -p "$project"
          cd "$project"
          echo '{ "name": "athanor-typed", "private": true, "type": "module" }' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$tgz"
          # The public options type-check. The test-only options (ADR 0003) are
          # left out of the declarations, so a typed caller that names one gets
          # an error.
          printf '%s\n' "import { run, status, prune } from '@mephistopheles4/athanor';" \
            "export const used = () => [run({ cwd: '.', name: 'test', untracked: true }), status(), prune({ dryRun: true, days: 30 })];" \
            "// @ts-expect-error docker is a test-only option." "export const h1 = () => run({ docker: ['docker'] });" \
            "// @ts-expect-error prefix is a test-only option." "export const h2 = () => run({ prefix: 'x' });" \
            "// @ts-expect-error timeLimitSeconds is a test-only option." "export const h3 = () => run({ timeLimitSeconds: 1 });" \
            "// @ts-expect-error graceSeconds is a test-only option." "export const h4 = () => run({ graceSeconds: 1 });" \
            "// @ts-expect-error docker is a test-only option." "export const h5 = () => status({ docker: ['docker'] });" \
            "// @ts-expect-error prefix is a test-only option." "export const h6 = () => status({ prefix: 'x' });" \
            "// @ts-expect-error docker is a test-only option." "export const h7 = () => prune({ docker: ['docker'] });" > check.mts
          node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" --noEmit --strict \
            --module nodenext --moduleResolution nodenext \
            --types node --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" check.mts

        run: | # zizmor: ignore[adhoc-packages] This installs athanor's own tarball to test the package; the test needs the install.
          set -e
          tgz=$(ls "$RUNNER_TEMP"/mephistopheles4-athanor-*.tgz)
          project="$RUNNER_TEMP/athanor-typed"
          mkdir -p "$project"
          cd "$project"
          echo '{ "name": "athanor-typed", "private": true, "type": "module" }' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$tgz"
          # The public options type-check. The test-only options (ADR 0003) are
          # left out of the declarations, so a typed caller that names one gets
          # an error.
          printf '%s\n' "import { run, status, prune } from '@mephistopheles4/athanor';" \
            "export const used = () => [run({ cwd: '.', name: 'test', untracked: true }), status(), prune({ dryRun: true, days: 30 })];" \
            "// @ts-expect-error docker is a test-only option." "export const h1 = () => run({ docker: ['docker'] });" \
            "// @ts-expect-error prefix is a test-only option." "export const h2 = () => run({ prefix: 'x' });" \
            "// @ts-expect-error timeLimitSeconds is a test-only option." "export const h3 = () => run({ timeLimitSeconds: 1 });" \
            "// @ts-expect-error graceSeconds is a test-only option." "export const h4 = () => run({ graceSeconds: 1 });" \
            "// @ts-expect-error docker is a test-only option." "export const h5 = () => status({ docker: ['docker'] });" \
            "// @ts-expect-error prefix is a test-only option." "export const h6 = () => status({ prefix: 'x' });" \
            "// @ts-expect-error docker is a test-only option." "export const h7 = () => prune({ docker: ['docker'] });" > check.mts
          node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" --noEmit --strict \
            --module nodenext --moduleResolution nodenext \
            --types node --typeRoots "$GITHUB_WORKSPACE/node_modules/@types" check.mts

  # The fast tier on Windows (T14), which was the owner's check by hand: npm ci
  # from the lockfile, the strict tsc check of the tests and the fast tier. The
  # docker tier on Docker Desktop (K5) stays by hand: a Windows runner has no
  # Linux container engine.
  ci-windows:
    name: ci-windows (node ${{ matrix.node }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the compiler from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict type check of the tests
        run: node node_modules/typescript/bin/tsc -p test/tsconfig.json --noEmit
      - name: Fast tier
        run: node test/run.mjs fast

  # The one check main's ruleset requires, under the name ci. if: always() runs
  # it even when a job it needs failed or was skipped, so it can say so; a
  # skipped required check would count as passing. A run that a newer push
  # cancels shows a red ci, which fails closed. The results reach the shell
  # through env:, never inline. ci-macos and ci-windows are not needed here:
  # they do not block a merge, and a release still waits for the whole run.
  ci:
    name: ci
    needs: [workflows, suite]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job it needs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test -n "$RESULTS" || { echo "ci needs no job. Put the jobs a merge waits for in its needs: list."; exit 1; }
          for r in $RESULTS; do
            test "$r" = success || { echo "A job ci needs ended $r. Open that job in this run: fix a failure and push again, or re-run a cancelled or flaky job."; exit 1; }
          done
          echo "Every job ci needs passed: $RESULTS"
